<script>
const def=()=>({pin:'1234',staff:[],svc:[],prod:[],dsc:[],sales:[],exp:[]});

const dtot=x=>Math.ceil(Math.round(Z(x.d||[],y=>y.a)*100)/100),tot=()=>Z(T,x=>x.p);

`<div class=seg3>${[['s','Servicios'],['a','Ampolletas'],['p','Productos']].map(a=>`<button class="${tab==a[0]?'on':''}" onclick="tab='${a[0]}';r()">${a[1]}</button>`).join('')}</div>

function add(i){const x=src()[i];if(!D.staff.length){alert('Agrega personal en Admin.');return}let p=x.p;if(!p){p=parseFloat(prompt('Precio de '+x.n));if(isNaN(p)||p<0)return}const s=tab=='s';T.push({fx:x.p>0?1:0,p0:p,k:s?'s':x.t,n:x.n,p,c:s?0:x.c,st:D.staff[sel].n,d:s?D.dsc.filter(z=>z.f&&z.s==x.n).map(z=>({n:z.n,q:'fijo',a:z.a})):[]});r()}

function adq(){const z=D.dsc[$('dc').value],s=$('dq').value.trim(),p=s.split('/'),n=p.length==2?p[0]/p[1]:parseFloat(s);if(!(n>0)||!isFinite(n)){alert('Escribe una cantidad válida.');return}T[ds].d.push({n:z.n,q:s,a:z.a*n});r()}
function modal(){const t=tot(),d=due(),e=pay.m=='e',W=['Cajero',...D.staff.map(s=>s.n)];return`<div class=ov><div class=md><div class=mu>Total a cobrar${pay.tp>0?' (cuenta '+m(t)+' + propina '+m(pay.tp)+')':''}</div><div class=big id=due>${m(d)}</div>
<div class=mu style="margin-top:8px">¿Deja propina?</div><div class=q>${[['0','Sin'],['10','10%'],['20','20%'],['50','50%'],['x','Otra']].map(o=>`<button class="${pay.tk==o[0]?'on':''}" onclick="stp('${o[0]}')">${o[1]}</button>`).join('')}</div>${pay.tk=='x'?`<input id=tc class=in style="margin-top:8px" inputmode=decimal placeholder="Monto de la propina" value="${pay.tp||''}" oninput="pay.tp=parseFloat(this.value)||0;ud()">`:''}${pay.tp>0||pay.tk=='x'?`<div class=mu style="margin-top:8px">¿Para quién?</div><div class=q>${W.map(n=>`<button class="${pay.w==n?'on':''}" data-n="${esc(n)}" onclick="pay.w=this.dataset.n;r()">${esc(n)}</button>`).join('')}</div>`:''}
<div class=seg><button class="${e?'on':''}" onclick="pay.m='e';r()">Efectivo</button><button class="${e?'':'on'}" onclick="pay.m='t';r()">Electrónico</button></div>
${e?`<label class=mu for=rc>Recibido</label><input id=rc class=in inputmode=decimal value="${pay.rec||''}" oninput="pay.rec=parseFloat(this.value)||0;ch()"><div class=q>${[due(),100,200,500,1000].map((n,i)=>`<button onclick="pay.rec=${n};r()">${i?m(n):'Exacto'}</button>`).join('')}</div><div class=chg>Cambio <div class=big id=chg>${chs()}</div></div>`:''}
<button class=b id=ok onclick="done()" ${okc()?'disabled':''}>Confirmar cobro</button><button class=in style="margin-top:8px" onclick="pay=null;r()">Cancelar</button></div></div>`}
const due=()=>tot()+(pay.tp||0),okc=()=>(pay.m=='e'&&pay.rec<due())||(pay.tp>0&&!pay.w);

function ch(){const c=$('chg');if(c)c.textContent=chs();$('ok').disabled=okc()}
function ud(){$('due').textContent=m(due());ch()}
function stp(k){pay.tk=k;pay.tp=k=='0'?0:k=='x'?pay.tp:Math.round(tot()*k)/100;if(k=='0')pay.w='';r()}

const R=(a,b)=>`<div class=row><span>${a}</span><b>${b}</b></div>`;
const dt=(k,t,b)=>`<details ${O[k]?'open':''} ontoggle="O['${k}']=this.open?1:0"><summary>${t}</summary>${b}</details>`;
function cut(){const A=agg(cd);return`<input class=in type=date value="${cd}" onchange="cd=this.value||today();r()">
<div class=card><h2>Resumen del día</h2>${R('Total (servicios)',m(A.tt))}${R('Ventas (ampolletas)',m(A.vt))}${R('Global',m(A.gl))}${R('Pagos-e (electrónicos)',m(A.pe))}${R('Gastos',m(A.gx))}${R('Efectivo',m(A.ef))}</div><div class=card>${R('Venta de productos (aparte del corte)',m(A.vp))}</div><div class=card><h2>Propinas</h2>${Object.keys(A.tp).map(w=>{const o=A.tp[w];return R(esc(w)+'<br><small>efectivo '+m(o.c)+' · electrónica '+m(o.e)+'</small>',m(o.c+o.e))}).join('')||'<p class=mu>Sin propinas en esta fecha.</p>'}${A.tpt?R('Total de propinas',m(A.tpt))+'<p class=mu style="margin:6px 0 0">Ya están descontadas del Efectivo (las electrónicas, dentro de Pagos-e).</p>':''}</div>

${R('Propinas recibidas',m(((A.tp[n]||{}).c||0)+((A.tp[n]||{}).e||0)))}${R('Servicios sin descuento',m(z.gs))}${R('Descuento total',m(z.dd))}${R('Servicios con descuento','<b>'+m(z.nt)+'</b>')}
${dt('c'+i+'s','Servicios ('+a.s.length+')',a.s.map(x=>R(esc(x.n)+'<br><small>cobrado '+m(x.p)+' · desc. '+m(dtot(x))+'</small>',m(x.p-dtot(x)))).join('')+R('Comisión de servicios ('+sc(n)+'%)',m(z.cs)))}
${dt('c'+i+'d','Desglose de descuentos',a.s.filter(x=>(x.d||[]).length).map(x=>`<p class=mu style="margin:8px 0 0">${esc(x.n)}</p>`+x.d.map(y=>R(esc(y.n)+' <small>'+esc(y.q)+'</small>',m(y.a))).join('')+R('Redondeado',m(dtot(x)))).join('')||'<p class=mu>Sin descuentos.</p>')}
${dt('c'+i+'a','Ampolletas ('+a.a.length+')',L('a','va','ca'))}${dt('c'+i+'p','Productos ('+a.p.length+')',L('p','vp','cp'))}</details>`}).join(''):'<p class=mu>Agrega personal en Admin.</p>'}
<div class=card><h2>Gastos</h2>${A.X.map(e=>`<div class=row><span>${esc(e.n)}</span><b>${m(e.a)}</b><button class=x onclick="delx(${e.t})" aria-label="Borrar gasto">✕</button></div>`).join('')||'<p class=mu>Sin gastos en esta fecha.</p>'}<div style="display:grid;grid-template-columns:1fr 110px;gap:6px;margin:8px 0"><input id=gn class=in placeholder="Concepto"><input id=ga class=in inputmode=decimal placeholder="Monto"></div><button class=in onclick="addx()">Agregar gasto</button></div>
<button class=b onclick="exp()">Exportar a Excel</button>
${A.S.length?`<button class=in style="margin-top:10px" onclick="if(confirm('¿Deshacer la última venta de este día?')){const i=D.sales.map(s=>s.d).lastIndexOf(cd);D.sales.splice(i,1);sv();r()}">Deshacer última venta</button>`:''}`}
function addx(){const n=$('gn').value.trim(),a=parseFloat($('ga').value);if(!n||isNaN(a)||a<=0){alert('Escribe el concepto y un monto mayor a 0.');return}D.exp.push({d:cd,t:Date.now(),n,a});sv();r()}

async function exp(){if(!window.XLSX){alert('Para exportar necesitas conexión a internet la primera vez.');return}
const A=agg(cd),TP={s:'Servicio',a:'Ampolleta',p:'Producto'},V=[['Fecha','Hora','Estilista','Tipo','Concepto','Precio','Descuento','Comisión','Pago']],E=[['Fecha','Estilista','Servicio','Concepto','Cantidad','Monto']];
D.sales.forEach(s=>s.items.forEach(x=>{const d=x.k=='s'?dtot(x):0;V.push([s.d,new Date(s.t).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}),x.st,TP[x.k],x.n,x.p,d,x.k=='s'?(x.p-d)*sc(x.st)/100:x.c,s.m=='e'?'Efectivo':'Electrónico']);(x.d||[]).forEach(y=>E.push([s.d,x.st,x.n,y.n,y.q,y.a]))}));

const pinb=(k,t)=>`<p class=mu style="margin:0 0 6px">${t}</p><input id=n_${k} class=in inputmode=numeric placeholder="Nuevo PIN (4 a 8 dígitos)"><button class=in style="margin-top:6px" onclick="setp('${k}')">Guardar</button>`;
function setp(k){const p=$('n_'+k).value;if(/^\d{4,8}$/.test(p)){D[k]=p;sv();$('n_'+k).value='';alert('PIN actualizado')}else alert('Usa de 4 a 8 números.')}
const ed=(a,i,f,x)=>{D[a][i][f]=['n','t','s'].includes(f)?x:(parseFloat(x)||0);sv()};
const del=(a,i)=>{if(confirm('¿Borrar?')){D[a].splice(i,1);sv();r()}};
const ad=a=>{D[a].push({staff:{n:'Nuevo',c:0},svc:{n:'Nuevo servicio',p:0},prod:{n:'Nuevo producto',p:0,c:0,t:'a'},dsc:{n:'Nuevo descuento',a:0,f:0,s:''}}[a]);O[a]=1;sv();r()};
const lb=(t,h)=>`<label class=lb>${t}${h}</label>`;
const ni=(a,i,f,x,w)=>`<input class=in ${w?'inputmode=decimal':''} value="${esc(x)}" onchange="ed('${a}',${i},'${f}',this.value)">`;
const sl=(a,i,f,x,o)=>`<select class=in onchange="ed('${a}',${i},'${f}',this.value);r()">${o.map(p=>`<option value="${esc(p[0])}" ${p[0]==x?'selected':''}>${esc(p[1])}</option>`).join('')}</select>`;
const dx=(a,i)=>`<button class=x onclick="del('${a}',${i})" aria-label="Borrar">✕</button>`;
const ir=(a,i,nm,rows)=>`<div class=ir>${lb('Nombre',ni(a,i,'n',nm))}<div class=ir2>${rows}${dx(a,i)}</div></div>`;
function adm(){return`<div class=card>`+dt('pin','PINs de acceso',pinb('apin','PIN de administración')+'<p class=mu style="margin:14px 0 6px">PIN de entrada</p>'+`<input id=np class=in inputmode=numeric placeholder="Nuevo PIN (4 a 8 dígitos)"><button class=b onclick="const p=$('np').value;if(/^\\d{4,8}$/.test(p)){D.pin=p;sv();$('np').value='';alert('PIN actualizado')}else alert('Usa de 4 a 8 números.')">Guardar PIN</button>`)+
dt('staff','Personal',`<p class=mu>Comisión: % sobre los servicios con descuento.</p>`+D.staff.map((s,i)=>ir('staff',i,s.n,lb('Comisión servicios %',ni('staff',i,'c',s.c,1)))).join('')+`<button class=in onclick="ad('staff')">Agregar persona</button>`)+
dt('svc','Servicios',`<p class=mu>Precio 0 = variable (se pide al cobrar).</p>`+D.svc.map((s,i)=>ir('svc',i,s.n,lb('Precio',ni('svc',i,'p',s.p,1)))).join('')+`<button class=in onclick="ad('svc')">Agregar servicio</button>`)+
dt('prod','Ampolletas y productos',`<p class=mu>La comisión es en pesos por pieza vendida.</p>`+D.prod.map((s,i)=>ir('prod',i,s.n,lb('Precio',ni('prod',i,'p',s.p,1))+lb('Comisión $',ni('prod',i,'c',s.c,1))+lb('Tipo',sl('prod',i,'t',s.t,[['a','Ampolleta'],['p','Producto']])))).join('')+`<button class=in onclick="ad('prod')">Agregar</button>`)+
dt('dsc','Descuentos a estilistas',`<p class=mu>Fijo: se descuenta solo al cobrar el servicio elegido. Calculado: al cobrar eliges la cantidad (ej. $2.5 por gramo).</p>`+D.dsc.map((s,i)=>ir('dsc',i,s.n,lb(s.f?'Monto $':'Costo por unidad $',ni('dsc',i,'a',s.a,1))+lb('Tipo',sl('dsc',i,'f',s.f,[['1','Fijo'],['0','Calculado']]))+(s.f?lb('Aplica a',sl('dsc',i,'s',s.s,[['','(ninguno)'],...D.svc.map(z=>[z.n,z.n])])):''))).join('')+`<button class=in onclick="ad('dsc')">Agregar descuento</button>`)+`</div>`}
r();
